<svg viewBox="0 0 1500 320" width="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F4FBFF" stop-opacity="1"/>
      <stop offset="45%" stop-color="#DCEEFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DCEEFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlurSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/> <!-- Tăng blur cho mây trông tự nhiên hơn -->
    </filter>

    <!-- Mask tạo hiệu ứng mờ dần lồng vào nền background -->
    <mask id="fadeMask">
      <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
        <stop offset="20%" stop-color="white" stop-opacity="1"/>
        <stop offset="85%" stop-color="white" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="0" width="1500" height="320" fill="url(#fadeGrad)"/>
    </mask>
  </defs>

  <!-- Nhóm toàn bộ nội dung trong mask mờ dần -->
  <g mask="url(#fadeMask)">
    <!-- Stars -->
    <g fill="#EAF6FF">
      <circle cx="80"  cy="40"  r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="0s"   repeatCount="indefinite"/></circle>
      <circle cx="200" cy="70"  r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="30"  r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="85"  r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="45"  r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="20"  r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="110" r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="120" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="35"  r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="75"  r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="30" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.5s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="95" r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="60"  cy="150" r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="3s"   begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="145" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="1s"   repeatCount="indefinite"/></circle>
      <circle cx="750" cy="110" r="1"  ><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Moon -->
    <g>
      <circle cx="1230" cy="65" r="70" fill="url(#moonGlow)" opacity="0.55"/>
      <circle cx="1230" cy="65" r="26" fill="#F6FBFF"/>
      <circle cx="1240" cy="58" r="24" fill="#0A1830" opacity="0.18"/>
    </g>

    <!-- Surface sparkle / glints - Giữ lại để lấp lánh giữa các tầng mây -->
    <g fill="#FFFFFF">
      <ellipse cx="220" cy="288" rx="3" ry="1.2" opacity="0.5"><animate attributeName="opacity" values="0;0.7;0" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="480" cy="292" rx="2.4" ry="1" opacity="0.5"><animate attributeName="opacity" values="0;0.6;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="700" cy="286" rx="3" ry="1.2" opacity="0.5"><animate attributeName="opacity" values="0;0.7;0" dur="2.4s" begin="1.3s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="980" cy="294" rx="2.6" ry="1" opacity="0.5"><animate attributeName="opacity" values="0;0.6;0" dur="2.1s" begin="0.5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="1120" cy="288" rx="3" ry="1.2" opacity="0.5"><animate attributeName="opacity" values="0;0.7;0" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="1380" cy="292" rx="2.4" ry="1" opacity="0.5"><animate attributeName="opacity" values="0;0.6;0" dur="2.3s" begin="0.7s" repeatCount="indefinite"/></ellipse>
    </g>

    <!-- Cloud Layer 1 (Tầng mây xa, mờ nhất, bay chậm nhất) -->
    <g fill="#B2C9E1" filter="url(#softBlurSmall)">
      <!-- Cloud 1.1 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="28s" begin="-8s" repeatCount="indefinite"/>
        <path d="M50,225 Q90,210 130,225 T190,225 Q230,240 270,225 Z" opacity="0.15"/>
      </g>
      <!-- Cloud 1.2 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="31s" begin="-14s" repeatCount="indefinite"/>
        <path d="M400,230 Q440,215 480,230 T540,230 Q580,245 620,230 Z" opacity="0.12"/>
      </g>
      <!-- Cloud 1.3 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="26s" begin="-3s" repeatCount="indefinite"/>
        <path d="M800,220 Q840,205 880,220 T940,220 Q980,235 1020,220 Z" opacity="0.18"/>
      </g>
      <!-- Cloud 1.4 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="33s" begin="-19s" repeatCount="indefinite"/>
        <path d="M1200,228 Q1240,213 1280,228 T1340,228 Q1380,243 1420,228 Z" opacity="0.14"/>
      </g>
    </g>

    <!-- Cloud Layer 2 (Tầng mây vừa, độ mờ trung bình, tốc độ trung bình) -->
    <g fill="#DCEEFF" filter="url(#softBlurSmall)">
      <!-- Cloud 2.1 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="18s" begin="-4s" repeatCount="indefinite"/>
        <path d="M150,245 Q190,230 230,245 T290,245 Q330,260 370,245 Z" opacity="0.25"/>
      </g>
      <!-- Cloud 2.2 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="16s" begin="-9s" repeatCount="indefinite"/>
        <path d="M600,252 Q640,237 680,252 T740,252 Q780,267 820,252 Z" opacity="0.28"/>
      </g>
      <!-- Cloud 2.3 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="20s" begin="-14s" repeatCount="indefinite"/>
        <path d="M1000,242 Q1040,227 1080,242 T1140,242 Q1180,257 1220,242 Z" opacity="0.22"/>
      </g>
      <!-- Cloud 2.4 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="17s" begin="-1s" repeatCount="indefinite"/>
        <path d="M1350,250 Q1390,235 1430,250 T1490,250 Q1530,265 1570,250 Z" opacity="0.32"/>
      </g>
    </g>

    <!-- Cloud Layer 3 (Tầng mây gần, rõ nhất, bay nhanh nhất) -->
    <g fill="#FFFFFF" filter="url(#softBlurSmall)">
      <!-- Cloud 3.1 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="11s" begin="-2s" repeatCount="indefinite"/>
        <path d="M300,270 Q340,255 380,270 T440,270 Q480,285 520,270 Z" opacity="0.45"/>
      </g>
      <!-- Cloud 3.2 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="9s" begin="-6s" repeatCount="indefinite"/>
        <path d="M750,280 Q790,265 830,280 T890,280 Q930,295 970,280 Z" opacity="0.55"/>
      </g>
      <!-- Cloud 3.3 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="12s" begin="-10s" repeatCount="indefinite"/>
        <path d="M1100,275 Q1140,260 1180,275 T1240,275 Q1280,290 1320,275 Z" opacity="0.48"/>
      </g>
      <!-- Cloud 3.4 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1600 0; -300 0" dur="10s" begin="-4s" repeatCount="indefinite"/>
        <path d="M50,288 Q90,273 130,288 T190,288 Q230,303 270,288 Z" opacity="0.52"/>
      </g>
    </g>
  </g>
</svg>
