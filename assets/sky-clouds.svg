<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="45%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7CC"/>
      <stop offset="100%" stop-color="#FFD966" stop-opacity="0"/>
    </radialGradient>
    <g id="cloudShape">
      <ellipse cx="0" cy="0" rx="34" ry="16" fill="#FFFFFF" opacity="0.85"/>
      <ellipse cx="26" cy="-8" rx="24" ry="14" fill="#FFFFFF" opacity="0.85"/>
      <ellipse cx="-26" cy="-6" rx="22" ry="13" fill="#FFFFFF" opacity="0.85"/>
      <ellipse cx="8" cy="-16" rx="20" ry="12" fill="#FFFFFF" opacity="0.85"/>
    </g>
  </defs>

  <rect width="900" height="170" fill="url(#skyGrad)"/>
  <circle cx="770" cy="45" r="60" fill="url(#sunGrad)"/>
  <circle cx="770" cy="45" r="20" fill="#FFEFB0" opacity="0.9"/>

  <!-- stars for the dark upper part -->
  <circle cx="60" cy="20" r="1.4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="140" cy="35" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="240" cy="15" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="420" cy="25" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="540" cy="12" r="1.3" fill="#FFFFFF" opacity="0.75"/>

  <!-- Drifting clouds -->
  <use href="#cloudShape" x="0" y="60">
    <animateTransform attributeName="transform" type="translate" from="-150 0" to="1050 0" dur="38s" repeatCount="indefinite"/>
  </use>
  <use href="#cloudShape" x="0" y="100" transform="scale(1.3)">
    <animateTransform attributeName="transform" type="translate" from="-260 0" to="900 0" dur="52s" begin="-10s" repeatCount="indefinite"/>
  </use>
  <use href="#cloudShape" x="0" y="30" transform="scale(0.7)">
    <animateTransform attributeName="transform" type="translate" from="-100 0" to="1200 0" dur="30s" begin="-5s" repeatCount="indefinite"/>
  </use>
  <use href="#cloudShape" x="0" y="130" transform="scale(1.0)">
    <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="45s" begin="-22s" repeatCount="indefinite"/>
  </use>
  <use href="#cloudShape" x="0" y="80" transform="scale(0.9)">
    <animateTransform attributeName="transform" type="translate" from="-180 0" to="1080 0" dur="34s" begin="-15s" repeatCount="indefinite"/>
  </use>
</svg>
