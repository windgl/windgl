    </g>
  </g>

  <g opacity="0.65" fill="#175C8A">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="9s" repeatCount="indefinite"/>
      <path d="M0,66 C125,52 250,80 375,66 C500,52 625,80 750,66 C875,52 1000,80 1125,66 C1250,52 1375,80 1500,66 L1500,140 L0,140 Z"/>
