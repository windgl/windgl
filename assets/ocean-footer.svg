<svg viewBox="0 0 1500 140" width="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fSeaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="30%"  stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#04101F"/>
    </linearGradient>
    <linearGradient id="fWave3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3FA0D8"/>
      <stop offset="100%" stop-color="#1C5D8C"/>
    </linearGradient>
    <filter id="fBlurSmall" x="-50%" y="-50%" width="200%" height="200%">
