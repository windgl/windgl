    </g>
    <g fill="none" stroke="#EAF7FF" stroke-width="2" opacity="0.4" filter="url(#fBlurSmall)">
      <path d="M0,92 C125,78 250,106 375,92 C500,78 625,106 750,92 C875,78 1000,106 1125,92 C1250,78 1375,106 1500,92"/>
      <path d="M0,92 C125,78 250,106 375,92 C500,78 625,106 750,92 C875,78 1000,106 1125,92 C1250,78 1375,106 1500,92" transform="translate(1500 0)"/>
